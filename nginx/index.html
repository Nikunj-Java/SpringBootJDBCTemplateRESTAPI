<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Employee Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="d-flex">

        <!-- Sidebar -->
        <nav class="sidebar p-3">

            <h3 class="text-white mb-4">REST API</h3>

            <a href="#dashboard">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a href="#employee">
                <i class="bi bi-people"></i>
                Employees
            </a>

            <a href="#">
                <i class="bi bi-building"></i>
                Departments
            </a>

            <a href="#">
                <i class="bi bi-bar-chart"></i>
                Analytics
            </a>

            <a href="#">
                <i class="bi bi-gear"></i>
                Settings
            </a>

        </nav>

        <!-- Main Content -->
        <div class="main-content flex-grow-1">

            <header class="topbar p-3 d-flex justify-content-between align-items-center">

                <h2 class="m-0">Spring Boot Employee Dashboard</h2>

                <i class="bi bi-person-circle fs-2"></i>

            </header>

            <div class="container-fluid p-4">

                <!-- Statistics -->
                <section id="dashboard">

                    <div class="row g-4">

                        <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
                            <div class="card stat">
                                <h6>Total Employees</h6>
                                <h2 id="empCount">0</h2>
                            </div>
                        </div>

                        <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
                            <div class="card stat">
                                <h6>Departments</h6>
                                <h2 id="deptCount">0</h2>
                            </div>
                        </div>

                        <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
                            <div class="card stat">
                                <h6>Average Salary</h6>
                                <h2 id="avgSalary">₹0</h2>
                            </div>
                        </div>

                        <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
                            <div class="card stat">
                                <h6>Highest Salary</h6>
                                <h2 id="maxSalary">₹0</h2>
                            </div>
                        </div>

                    </div>

                    <!-- Charts -->
                    <div class="row mt-4">

                        <div class="col-xl-6 col-lg-6 col-md-12 mb-4">
                            <div class="card p-3">
                                <canvas id="pieChart"></canvas>
                            </div>
                        </div>

                        <div class="col-xl-6 col-lg-6 col-md-12 mb-4">
                            <div class="card p-3">
                                <canvas id="barChart"></canvas>
                            </div>
                        </div>

                    </div>

                </section>

                <!-- Employee Table -->
                <section id="employee">

                    <div class="card p-4 shadow-lg">

                        <div
                            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-3">

                            <h4 class="m-0">Employee Management</h4>

                            <div class="d-flex gap-2">

                                <input type="text" id="searchEmployee" class="form-control"
                                    placeholder="Search Employee">

                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#employeeModal">
                                    <i class="bi bi-plus-circle"></i>
                                    Add Employee
                                </button>

                            </div>

                        </div>

                        <div class="table-responsive">

                            <table class="table table-dark table-hover align-middle">

                                <thead>

                                    <tr>

                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Department</th>
                                        <th>Salary</th>
                                        <th>Actions</th>

                                    </tr>

                                </thead>

                                <tbody id="tbody">
                                </tbody>

                            </table>

                        </div>

                    </div>

                </section>

            </div>

        </div>

    </div>
    <!-- Add Employee Modal -->
    <div class="modal fade" id="employeeModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content bg-dark text-white border-0 rounded-4">

                <div class="modal-header border-secondary">
                    <h4 class="modal-title">
                        <i class="bi bi-person-plus-fill text-primary"></i>
                        Add Employee
                    </h4>

                    <button class="btn-close btn-close-white" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <form id="employeeForm">


                        <div class="row">
                            <input type="hidden" id="empId">

                            <!-- Employee Name -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Employee Name</label>
                                <input type="text" class="form-control" id="empName" placeholder="Enter Name">
                            </div>

                            <!-- Department -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Department</label>

                                <select class="form-select" id="empDepartment">
                                    <option value="">Select Department</option>
                                    <option>IT</option>
                                    <option>HR</option>
                                    <option>Finance</option>
                                    <option>Marketing</option>
                                    <option>Sales</option>
                                </select>
                            </div>

                            <!-- Salary -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Salary</label>
                                <input type="number" class="form-control" id="empSalary" placeholder="Enter Salary">
                            </div>

                        </div>

                    </form>

                </div>

                <div class="modal-footer border-secondary">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button class="btn btn-success" id="saveEmployee">

                        <i class="bi bi-check-circle"></i>
                        Save Employee

                    </button>

                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
